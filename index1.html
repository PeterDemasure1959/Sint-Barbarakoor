<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De zang van de eucharistie – 28ste zondag door het jaar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1e9;color:#202020;font-family:Georgia,"Times New Roman",serif}
header{text-align:center;background:#fff;padding:30px 16px 24px;border-bottom:1px solid #d8d2c5}
h1{margin:0;font-size:clamp(28px,4.5vw,48px);font-weight:600}
.subtitle{margin-top:8px;font-size:clamp(18px,2.3vw,25px);color:#555}
main{max-width:1450px;margin:28px auto;padding:0 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;align-items:start}
.card{background:#fff;border:1px solid #ded9cf;border-radius:12px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.06);overflow:hidden}
.head{min-height:88px;text-align:center}
.role{font:700 17px Arial,sans-serif;color:#6b6254;margin-bottom:7px}
h2{font-size:clamp(20px,2vw,28px);margin:0 0 15px}
video{display:block;width:100%;max-height:300px;background:#111;border-radius:7px;margin-bottom:16px}
.score{display:block;width:100%;height:auto;border-radius:5px}
@media(max-width:800px){main{grid-template-columns:1fr;padding:0 10px;gap:14px}.card{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>De zang van de eucharistie</h1>
  <div class="subtitle">28ste zondag door het jaar</div>
</header>
<main>
    <article class="card">
      <div class="head">
        <div class="role">Intredezang</div>
        <h2>ZJ 713 – God is de Herder</h2>
      </div>
      <video controls preload="metadata" playsinline src="ZJ713.mp4"></video>
      <a href="ZJ713.png" target="_blank" title="Klik om de bladmuziek groter te bekijken">
        <img class="score" src="ZJ713.png" alt="God is de Herder">
      </a>
    </article>
    <article class="card">
      <div class="head">
        <div class="role">Offerandezang</div>
        <h2>ZJ 535 – Het brood, het goede brood</h2>
      </div>
      <video controls preload="metadata" playsinline src="ZJ535.mp4"></video>
      <a href="ZJ535.png" target="_blank" title="Klik om de bladmuziek groter te bekijken">
        <img class="score" src="ZJ535.png" alt="Het brood, het goede brood">
      </a>
    </article>
    <article class="card">
      <div class="head">
        <div class="role">Communiezang</div>
        <h2>ZJ 662 – God die ons aan elkaar</h2>
      </div>
      <video controls preload="metadata" playsinline src="ZJ662.mp4"></video>
      <a href="ZJ662.jpg" target="_blank" title="Klik om de bladmuziek groter te bekijken">
        <img class="score" src="ZJ662.jpg" alt="God die ons aan elkaar">
      </a>
    </article>
    <article class="card">
      <div class="head">
        <div class="role">Wegzending</div>
        <h2>LB 416 – Ga met God</h2>
      </div>
      <video controls preload="metadata" playsinline src="LB416.mp4"></video>
      <a href="LB416.jpg" target="_blank" title="Klik om de bladmuziek groter te bekijken">
        <img class="score" src="LB416.jpg" alt="Ga met God">
      </a>
    </article></main>
</body>
</html>
